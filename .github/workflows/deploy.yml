name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --base-href /digicore-fe-assessment/
      # GitHub Pages has no SPA fallback, so deep links (/transactions) are served via 404.html.
      - run: cp dist/digicore-fe-assessment/browser/index.html dist/digicore-fe-assessment/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/digicore-fe-assessment/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
